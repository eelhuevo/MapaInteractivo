<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniMap - Administracion</title>

  <!-- Tema (claro/oscuro) aplicado antes del primer pintado -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('unimap_tema');
        if (t !== 'claro' && t !== 'oscuro') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        }
        document.documentElement.setAttribute('data-theme', t === 'oscuro' ? 'dark' : 'light');
      } catch (e) { /* sin localStorage: tema claro */ }
    })();
  </script>

  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/hus.css?v=4">
  <link rel="stylesheet" href="css/admin.css?v=4">
</head>
<body class="admin-body">

  <!-- Cabecera -->
  <header class="admin-top">
    <div class="top-left">
      <div class="logo-small">UM</div>
      <span class="app-name" data-i18n="adm.titulo">Administracion del Campus</span>
    </div>
    <div class="admin-top-right">
      <!-- Modo claro / oscuro -->
      <button id="boton-tema" class="boton-idioma" title="Cambiar tema" data-i18n-title="top.tema">
        <svg class="icono-tema-claro" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icono-tema-oscuro" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="btn-icon boton-idioma" title="Idioma" data-i18n-title="top.idioma">
        <span id="idioma-actual">ES</span>
      </button>
      <a href="mapa.html" class="btn-admin-volver" data-i18n="adm.volver">Volver al mapa</a>
    </div>
  </header>

  <!-- Sin permisos -->
  <div id="admin-sin-permisos" class="admin-sin-permisos hidden">
    <div class="admin-sin-permisos-card">
      <div class="fav-vacio-icono">&#128274;</div>
      <p id="texto-sin-permisos" data-i18n="adm.sinPermisos">Necesitas iniciar sesion como administrador</p>
      <a href="../index.html" class="btn-admin-volver" data-i18n="auth.entrar">Entrar</a>
    </div>
  </div>

  <!-- Contenido -->
  <main id="admin-contenido" class="admin-contenido hidden">

    <!-- Tabs -->
    <nav class="admin-tabs" role="tablist">
      <button class="admin-tab active" data-tab="espacios" data-i18n="adm.espacios">Espacios</button>
      <button class="admin-tab" data-tab="estadisticas" data-i18n="adm.estadisticas">Estadisticas</button>
    </nav>

    <!-- TAB: ESPACIOS -->
    <section id="tab-espacios" class="admin-tab-panel">
      <div class="admin-toolbar">
        <input type="text" id="admin-buscar" data-i18n-placeholder="adm.buscarPh" placeholder="Buscar espacio...">
        <select id="admin-filtro-torre">
          <option value="" data-i18n="filtros.torre">Torre</option>
          <option value="1" data-i18n="torre.antigua">Torre Antigua</option>
          <option value="2" data-i18n="torre.innovacion">Torre Innovacion</option>
        </select>
        <select id="admin-filtro-tipo">
          <option value="" data-i18n="adm.tipo">Tipo</option>
          <option value="aula" data-i18n="tipo.aula">Aulas</option>
          <option value="laboratorio" data-i18n="tipo.laboratorio">Laboratorios</option>
          <option value="oficina" data-i18n="tipo.oficina">Oficinas</option>
          <option value="biblioteca" data-i18n="tipo.biblioteca">Biblioteca</option>
          <option value="auditorio" data-i18n="tipo.auditorio">Auditorios</option>
          <option value="comedor" data-i18n="tipo.comedor">Comedor</option>
          <option value="deportivo" data-i18n="tipo.deportivo">Deportivo</option>
          <option value="salon" data-i18n="tipo.salon">Salones</option>
        </select>
        <button id="admin-restaurar" class="btn-admin-secundario" data-i18n="adm.restaurar">Restaurar datos demo</button>
        <button id="admin-nuevo" class="btn-admin-primario" data-i18n="adm.nuevo">Nuevo espacio</button>
      </div>

      <div class="admin-tabla-wrap">
        <table class="admin-tabla">
          <thead>
            <tr>
              <th data-i18n="adm.nombre">Nombre</th>
              <th data-i18n="adm.tipo">Tipo</th>
              <th data-i18n="adm.torre">Torre</th>
              <th data-i18n="adm.piso">Piso</th>
              <th data-i18n="adm.horario">Horario de atencion</th>
              <th data-i18n="adm.estado">Estado</th>
              <th data-i18n="adm.accion">Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-cuerpo"></tbody>
        </table>
        <div id="admin-vacio" class="admin-vacio hidden" data-i18n="adm.vacio">Sin resultados</div>
      </div>
    </section>

    <!-- TAB: ESTADISTICAS (HU-14) -->
    <section id="tab-estadisticas" class="admin-tab-panel hidden">
      <div class="stats-cards">
        <div class="stats-card">
          <div class="stats-valor" id="stats-total-espacios">0</div>
          <div class="stats-etiqueta" data-i18n="est.total">Total de espacios</div>
        </div>
        <div class="stats-card">
          <div class="stats-valor" id="stats-total-consultas">0</div>
          <div class="stats-etiqueta" data-i18n="est.consultas">consultas</div>
        </div>
      </div>

      <div class="stats-bloque">
        <h3 data-i18n="adm.seccionTop">Mas consultados</h3>
        <div id="stats-top" class="stats-lista"></div>
      </div>

      <div class="stats-bloque">
        <h3 data-i18n="adm.seccionTipo">Distribucion por tipo</h3>
        <div id="stats-tipos" class="stats-lista"></div>
      </div>
    </section>
  </main>

  <!-- Modal: alta / edicion de espacio (HU-06) -->
  <div id="modal-espacio" class="modal hidden">
    <div class="modal-content modal-espacio">
      <div class="modal-header">
        <h3 id="modal-espacio-titulo" data-i18n="adm.editar">Editar</h3>
        <button class="btn-close cerrar-modal-admin">&times;</button>
      </div>
      <form id="form-espacio">
        <div class="form-row">
          <div class="form-group">
            <label for="esp-nombre" data-i18n="adm.nombre">Nombre</label>
            <input type="text" id="esp-nombre" required>
            <span class="error-msg" id="esp-nombre-error"></span>
          </div>
          <div class="form-group">
            <label for="esp-tipo" data-i18n="adm.tipo">Tipo</label>
            <select id="esp-tipo">
              <option value="aula" data-i18n="tipo.aula">Aulas</option>
              <option value="laboratorio" data-i18n="tipo.laboratorio">Laboratorios</option>
              <option value="oficina" data-i18n="tipo.oficina">Oficinas</option>
              <option value="biblioteca" data-i18n="tipo.biblioteca">Biblioteca</option>
              <option value="auditorio" data-i18n="tipo.auditorio">Auditorios</option>
              <option value="comedor" data-i18n="tipo.comedor">Comedor</option>
              <option value="deportivo" data-i18n="tipo.deportivo">Deportivo</option>
              <option value="salon" data-i18n="tipo.salon">Salones</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="esp-torre" data-i18n="adm.torre">Torre</label>
            <select id="esp-torre">
              <option value="1" data-i18n="torre.antigua">Torre Antigua</option>
              <option value="2" data-i18n="torre.innovacion">Torre Innovacion</option>
            </select>
          </div>
          <div class="form-group">
            <label for="esp-piso" data-i18n="adm.piso">Piso</label>
            <select id="esp-piso"></select>
            <span class="error-msg" id="esp-piso-error"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="esp-horario" data-i18n="adm.horario">Horario de atencion</label>
            <input type="text" id="esp-horario" placeholder="08:00-18:00">
          </div>
          <div class="form-group">
            <label for="esp-telefono" data-i18n="adm.telefono">Contacto</label>
            <input type="text" id="esp-telefono" placeholder="Ext. 101">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="esp-capacidad" data-i18n="adm.capacidad">Capacidad</label>
            <input type="number" id="esp-capacidad" min="0" value="0">
          </div>
          <div class="form-group">
            <label for="esp-estado" data-i18n="adm.estado">Estado</label>
            <select id="esp-estado">
              <option value="activo" data-i18n="ley.activo">Activo</option>
              <option value="inactivo" data-i18n="ley.inactivo">Inactivo</option>
            </select>
          </div>
        </div>

        <div class="admin-form-acciones">
          <button type="button" class="btn-admin-secundario cerrar-modal-admin" data-i18n="adm.cancelar">Cancelar</button>
          <button type="submit" class="btn-admin-primario" data-i18n="adm.guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notificacion -->
  <div id="notificacion" class="notification hidden">
    <span id="mensaje-notificacion"></span>
    <button id="cerrar-notificacion" class="btn-close-sm">&times;</button>
  </div>

  <script src="js/core/store.js?v=6"></script>
  <script src="js/core/i18n.js?v=7"></script>
  <script src="js/core/estadisticas.js?v=3"></script>
  <script src="js/core/avisos.js?v=3"></script>
  <script src="js/data/categorias.js?v=3"></script>
  <script src="js/data/edificios.js?v=6"></script>
  <script src="js/data/docentes.js?v=3"></script>
  <script src="js/data/espacios.js?v=5"></script>
  <script src="js/core/personalizacion.js?v=4"></script>
  <script src="js/auth/auth.js?v=3"></script>
  <script src="js/admin/admin.js?v=4"></script>
  <script>
    /* Tema claro/oscuro en la pantalla de administracion */
    (function () {
      var btn = document.getElementById('boton-tema');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
        var nuevo = oscuro ? 'claro' : 'oscuro';
        try { localStorage.setItem('unimap_tema', nuevo); } catch (e) { /* sin storage */ }
        document.documentElement.setAttribute('data-theme', nuevo === 'oscuro' ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
