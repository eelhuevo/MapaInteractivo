<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniMap - Campus Universitario</title>

  <!-- CSS: hojas divididas por capitulo -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/view3d.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- MAP SECTION -->
  <div id="pantalla-mapa" class="map-screen">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-left">
        <div class="logo-small">UM</div>
        <span class="app-name">UniMap</span>
      </div>

      <div class="search-container">
        <input type="text" id="campo-busqueda" placeholder="Buscar aula, oficina, docente...">
        <button id="boton-busqueda" class="btn-icon" title="Buscar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div id="resultados-busqueda" class="search-results hidden"></div>
      </div>

      <div class="top-right">
        <!-- Conmutador 2D / 3D -->
        <div class="toggle-vista" id="toggle-vista" role="group" aria-label="Vista del mapa">
          <button id="boton-vista-2d" class="toggle-opcion active" title="Vista plano 2D">2D</button>
          <button id="boton-vista-3d" class="toggle-opcion" title="Vista tridimensional 3D">3D</button>
        </div>

        <button id="boton-filtros" class="btn-icon" title="Filtros">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </button>
        <button id="boton-horarios" class="btn-icon" title="Horarios">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
        <button id="boton-favoritos" class="btn-icon" title="Favoritos" style="display:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>

        <div class="user-badge" id="user-badge">
          <span class="badge-rol" id="badge-rol"></span>
          <span id="nombre-usuario">Invitado</span>
          <button id="boton-salir" class="btn-text" title="Cerrar sesion">Salir</button>
        </div>
      </div>
    </header>

    <!-- Filter Panel -->
    <aside id="panel-filtros" class="filter-panel hidden">
      <div class="panel-header">
        <h3>Filtros</h3>
        <button id="cerrar-filtros" class="btn-close">&times;</button>
      </div>
      <div class="filter-section">
        <h4>Tipo de espacio</h4>
        <label class="filter-check"><input type="checkbox" value="aula" checked> Aulas</label>
        <label class="filter-check"><input type="checkbox" value="laboratorio" checked> Laboratorios</label>
        <label class="filter-check"><input type="checkbox" value="oficina" checked> Oficinas</label>
        <label class="filter-check"><input type="checkbox" value="biblioteca" checked> Biblioteca</label>
        <label class="filter-check"><input type="checkbox" value="auditorio" checked> Auditorios</label>
        <label class="filter-check"><input type="checkbox" value="comedor" checked> Comedor</label>
        <label class="filter-check"><input type="checkbox" value="deportivo" checked> Deportivo</label>
        <label class="filter-check"><input type="checkbox" value="salon" checked> Salones</label>
      </div>
      <div class="filter-section">
        <h4>Disponibilidad</h4>
        <label class="filter-check"><input type="checkbox" id="filtro-disponible" checked> Disponibles</label>
        <label class="filter-check"><input type="checkbox" id="filtro-no-disponible" checked> No disponibles</label>
      </div>
      <div class="filter-section">
        <h4>Piso</h4>
        <div class="floor-filters" id="filtros-piso">
          <label class="filter-check"><input type="checkbox" value="0" checked> Planta Baja</label>
          <label class="filter-check"><input type="checkbox" value="1" checked> Piso 1</label>
          <label class="filter-check"><input type="checkbox" value="2" checked> Piso 2</label>
          <label class="filter-check"><input type="checkbox" value="3" checked> Piso 3</label>
        </div>
      </div>
      <button id="aplicar-filtros" class="btn-primary btn-full">Aplicar Filtros</button>
      <button id="restablecer-filtros" class="btn-secondary btn-full">Restablecer</button>
    </aside>

    <!-- Favorites Panel -->
    <aside id="panel-favoritos" class="favorites-panel hidden">
      <div class="panel-header">
        <h3>Mis Favoritos</h3>
        <button id="cerrar-favoritos" class="btn-close">&times;</button>
      </div>
      <div id="lista-favoritos" class="favorites-list"></div>
    </aside>

    <!-- Schedule Panel -->
    <aside id="panel-horarios" class="schedule-panel hidden">
      <div class="panel-header">
        <h3>Horarios de Docentes</h3>
        <button id="cerrar-horarios" class="btn-close">&times;</button>
      </div>
      <div class="schedule-search">
        <input type="text" id="campo-busqueda-horario" placeholder="Buscar docente...">
      </div>
      <div id="lista-horarios" class="schedule-list"></div>
    </aside>

    <!-- Floor Selector -->
    <div class="floor-selector">
      <button class="boton-piso" data-floor="3">P3</button>
      <button class="boton-piso" data-floor="2">P2</button>
      <button class="boton-piso" data-floor="1">P1</button>
      <button class="boton-piso active" data-floor="0">PB</button>
    </div>

    <!-- Map Canvas + Visor 3D -->
    <div class="map-wrapper" id="contenedor-mapa">
      <canvas id="lienzo-mapa"></canvas>

      <!-- ===== VISOR 3D ===== -->
      <div id="visor-3d" class="visor-3d hidden">
        <canvas id="lienzo-3d"></canvas>

        <!-- Marcadores proyectados del espacio actual -->
        <div id="marcadores-3d" class="marcadores-3d"></div>

        <!-- Selector de modelo -->
        <div class="selector-modelo">
          <button id="boton-modelo" class="boton-modelo" aria-haspopup="listbox">Modelo: Edificio</button>
          <ul id="lista-modelos" class="lista-modelos hidden" role="listbox"></ul>
        </div>

        <!-- Controles de camara -->
        <div class="controles-3d">
          <button id="camara-reiniciar" class="btn-zoom" title="Restablecer camara">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          </button>
          <button id="rotacion-auto" class="btn-zoom" title="Rotacion automatica">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
        </div>

        <!-- Capa de carga -->
        <div id="carga-3d" class="carga-3d hidden">
          <div class="carga-3d-card">
            <div class="carga-3d-anillo"></div>
            <div class="carga-3d-titulo">Cargando modelo 3D</div>
            <div class="carga-3d-barra"><div id="barra-carga-3d" class="carga-3d-progreso"></div></div>
            <div id="texto-carga-3d" class="carga-3d-texto">Preparando escena...</div>
          </div>
        </div>

        <!-- Aviso de error / informacion -->
        <div id="aviso-3d" class="aviso-3d hidden"></div>
      </div>

      <!-- Tooltip (compartido por 2D y 3D) -->
      <div id="tooltip-mapa" class="map-tooltip hidden">
        <div class="tooltip-header">
          <span id="tooltip-nombre"></span>
          <span id="tooltip-estado" class="tooltip-status"></span>
        </div>
        <div id="tooltip-tipo" class="tooltip-type"></div>
        <div id="tooltip-info" class="tooltip-info"></div>
        <div id="tooltip-horario" class="tooltip-schedule"></div>
        <button id="tooltip-favorito" class="btn-fav btn-sm hidden"></button>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item"><span class="legend-color disponible"></span> Activo</div>
      <div class="legend-item"><span class="legend-color noDisponible"></span> Inactivo</div>
      <div class="legend-item leyenda-2d"><span class="legend-color ubicacion"></span> Usted aqui</div>
    </div>

    <!-- Zoom Controls (solo 2D) -->
    <div class="zoom-controls" id="controles-zoom">
      <button id="zoom-acercar" class="btn-zoom" title="Acercar">+</button>
      <button id="zoom-alejar" class="btn-zoom" title="Alejar">-</button>
      <button id="zoom-reiniciar" class="btn-zoom" title="Restablecer vista">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </button>
    </div>

    <!-- Mini Legend / Info -->
    <div class="map-info" id="info-mapa">
      <span id="etiqueta-piso-actual">Planta Baja</span>
      <span id="nivel-zoom">100%</span>
    </div>

    <!-- Notification -->
    <div id="notificacion" class="notification hidden">
      <span id="mensaje-notificacion"></span>
      <button id="cerrar-notificacion" class="btn-close-sm">&times;</button>
    </div>

  </div>

  <!-- ===== vendor: Three.js (local, sin conexion) ===== -->
  <script src="vendor/three/three.min.js"></script>
  <script src="vendor/three/fflate.min.js"></script>
  <script src="vendor/three/NURBSUtils.js"></script>
  <script src="vendor/three/NURBSCurve.js"></script>
  <script src="vendor/three/GLTFLoader.js"></script>
  <script src="vendor/three/FBXLoader.js"></script>
  <script src="vendor/three/OrbitControls.js"></script>

  <!-- ===== nucleo ===== -->
  <script src="js/core/store.js"></script>

  <!-- ===== datos ===== -->
  <script src="js/data/categorias.js"></script>
  <script src="js/data/edificios.js"></script>
  <script src="js/data/docentes.js"></script>
  <script src="js/data/espacios.js"></script>

  <!-- ===== sesion ===== -->
  <script src="js/auth/auth.js"></script>

  <!-- ===== mapa 2D ===== -->
  <script src="js/map/tooltip.js"></script>
  <script src="js/map/map2d.js"></script>
  <script src="js/map/filtros.js"></script>
  <script src="js/map/busqueda.js"></script>
  <script src="js/map/horarios.js"></script>
  <script src="js/map/favoritos.js"></script>

  <!-- ===== visor 3D ===== -->
  <script src="js/view3d/viewer3d.js"></script>

  <!-- ===== interfaz y arranque ===== -->
  <script src="js/core/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
